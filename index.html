<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulm Energy</title>
<meta name="description" content="Kulm Energy — a new wave of innovation is coming.">
<meta name="theme-color" content="#1c1a24">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    background:#1c1a24 url("mountain.jpg") center 40%/cover no-repeat;
    color:#fff;text-align:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:linear-gradient(180deg,rgba(10,10,20,.35) 0%,rgba(10,10,20,.38) 50%,rgba(10,10,20,.6) 100%);
  }
  main{position:relative;padding:0 1.5rem}
  .brand{
    font-size:clamp(.75rem,1.6vw,.95rem);font-weight:500;
    letter-spacing:.38em;text-transform:uppercase;opacity:.85;
    margin-bottom:1.1rem;padding-left:.38em;
    text-shadow:0 1px 12px rgba(0,0,0,.5);
  }
  h1{
    font-size:clamp(2.4rem,7vw,5.6rem);font-weight:700;
    letter-spacing:-.025em;line-height:1.04;max-width:14ch;margin:0 auto;
    background:linear-gradient(100deg,#ffffff 0%,#ffe3c2 45%,#ffb38a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 18px rgba(0,0,0,.35));
  }
  .sub{
    margin-top:1.3rem;font-size:clamp(1rem,2.2vw,1.45rem);font-weight:400;
    letter-spacing:.01em;opacity:.88;text-shadow:0 1px 14px rgba(0,0,0,.5);
  }
  .brand,h1,.sub,.rule{opacity:0;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards}
  h1{animation-delay:.25s}.sub{animation-delay:.7s}.rule{animation-delay:1s}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .brand{animation-name:rise85}
  @keyframes rise85{from{opacity:0;transform:translateY(18px)}to{opacity:.85;transform:none}}
  .sub{animation-name:rise88}
  @keyframes rise88{from{opacity:0;transform:translateY(18px)}to{opacity:.88;transform:none}}
  @media (prefers-reduced-motion:reduce){.brand,h1,.sub,.rule{animation:none;opacity:1}}
  .rule{width:48px;height:1px;background:rgba(255,255,255,.6);margin:1.4rem auto 0}
  @media (max-aspect-ratio:3/4){body{background-position:30% 40%}}
  .credit{
    position:fixed;right:.9rem;bottom:.6rem;z-index:1;
    font-size:.65rem;color:rgba(255,255,255,.5);
  }
  .credit a{color:inherit;text-decoration:none}
  .credit a:hover{color:rgba(255,255,255,.85)}
</style>
</head>
<body>
<main>
  <p class="brand">Kulm Energy</p>
  <h1>A new wave of innovation is&nbsp;coming.</h1>
  <p class="sub">Energy. Data. Intelligence.</p>
  <div class="rule" aria-hidden="true"></div>
</main>
<p class="credit">Photo: <a href="https://unsplash.com/photos/infssQ2tjeM" rel="noopener">Unsplash</a></p>
</body>
</html>
